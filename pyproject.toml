[project]
name = "torre-hanoi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
hanoi = "torre_hanoi.cli:run"
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src/torre_hanoi"]
 
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4",
]
